# Base stack: postgres + FastAPI backend + Next.js frontend.
#
# Development:  docker compose up -d --build
#               (docker-compose.override.yml is loaded automatically: ports, live reload, source mount)
# Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#               (explicit -f files disable the automatic dev override; nginx is added)

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: personalfinance
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personalfinance"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/personalfinance
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-in-production}
      DEBUG: "true"
      AUTO_CREATE_DB: "true"
      RUN_MIGRATIONS: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time; rebuild after changing it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
    environment:
      PRISMA_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/pishbin_prisma?schema=public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Optional: create the Prisma demo tables in the separate pishbin_prisma database.
  #   docker compose --profile prisma run --rm prisma-setup
  prisma-setup:
    profiles: ["prisma"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prisma-tools
    environment:
      PRISMA_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/pishbin_prisma?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
